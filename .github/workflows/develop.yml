name: Dev Build

# Manual test build. Run it from a branch named develop/mc<minecraft version>-gt<gtceu version>,
# e.g. develop/mc1.20.1-gt7.5.3. The version is <mod_version from gradle.properties>-dev.<run number>.
# Published as a GitHub pre-release only, never to CurseForge.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dev-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the changelog

      - name: Parse and check version
        id: meta
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^develop/mc([^-]+)-gt([^-]+)$ ]]; then
            echo "::error::Branch '$GITHUB_REF_NAME' does not match develop/mc<mc>-gt<gtceu>. Pick it under 'Use workflow from'."
            exit 1
          fi
          MC="${BASH_REMATCH[1]}"
          GT="${BASH_REMATCH[2]}"

          prop() { grep -E "^$1=" gradle.properties | cut -d= -f2- | tr -d '\r'; }
          if [[ "$MC" != "$(prop minecraft_version)" ]]; then
            echo "::error::Branch says Minecraft $MC, gradle.properties says $(prop minecraft_version)"
            exit 1
          fi
          if [[ "$GT" != "$(prop gtceu_version)" ]]; then
            echo "::error::Branch says GTCEu $GT, gradle.properties says $(prop gtceu_version)"
            exit 1
          fi

          VERSION="$(prop mod_version)-dev.${GITHUB_RUN_NUMBER}"
          FULL="mc$MC-gt$GT-$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$FULL" >/dev/null; then
            echo "::error::Tag v$FULL already exists."
            exit 1
          fi

          {
            echo "mc=$MC"
            echo "gt=$GT"
            echo "version=$VERSION"
            echo "full=$FULL"
          } >> "$GITHUB_OUTPUT"
          echo "Building $FULL"

      - name: Collect changelog
        id: changelog
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          # every non-merge commit since the previous build (release or dev) of this Minecraft/GTCEu pair, oldest first
          PREV=$(git describe --tags --abbrev=0 --match "vmc${{ steps.meta.outputs.mc }}-gt${{ steps.meta.outputs.gt }}-*" HEAD 2>/dev/null || true)
          COMMITS=$(git log --reverse --no-merges --format="- %s ([%h]($REPO_URL/commit/%H))" "${PREV:+$PREV..}HEAD")
          [[ -z "$COMMITS" ]] && COMMITS="- No changes"
          echo "$COMMITS"

          {
            echo "text<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: chmod +x ./gradlew && ./gradlew build -Pmod_version=${{ steps.meta.outputs.version }}

      - name: Locate mod JAR
        id: jar
        shell: bash
        run: |
          shopt -s nullglob
          filtered=()
          for jar in build/libs/*.jar; do
            [[ "$jar" == *-sources.jar || "$jar" == *-javadoc.jar ]] && continue
            filtered+=("$jar")
          done

          if [[ ${#filtered[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one production JAR, found ${#filtered[@]}"
            printf '%s\n' "${filtered[@]}"
            exit 1
          fi
          echo "path=${filtered[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.full }}
          name: GTM Powerlines ${{ steps.meta.outputs.version }} (MC ${{ steps.meta.outputs.mc }}, GTCEu ${{ steps.meta.outputs.gt }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: ${{ steps.changelog.outputs.text }}
          files: ${{ steps.jar.outputs.path }}